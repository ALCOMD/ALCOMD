[package]
name = "alcomd-mcp-tools-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
publish = false
[lib]
crate-type = ["cdylib"]
[workspace]
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = "debuginfo"
[dependencies]
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc", "std"] }
serde_json = "=1.0.151"
