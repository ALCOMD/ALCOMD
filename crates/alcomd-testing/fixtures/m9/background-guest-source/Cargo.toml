[package]
name = "alcomd-background-test-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["VRCLearn"]
homepage = "https://alcomd.vrclearn.com/"
license = "AGPL-3.0-only"
repository = "https://github.com/ALCOMD/ALCOMD"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = "debuginfo"

[dependencies]
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc", "std"] }
