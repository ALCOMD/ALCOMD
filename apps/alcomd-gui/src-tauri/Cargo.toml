[package]
name = "alcomd-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "alcomd_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true
toml.workspace = true

[dependencies]
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
alcomd-client.workspace = true
alcomd-platform.workspace = true
alcomd-protocol.workspace = true
open.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-single-instance = "=2.4.5"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "=0.18.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSBundle", "NSString", "NSURL"] }
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["std", "UTType"] }

[lints]
workspace = true
