name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata and identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate metadata
        run: python3 scripts/validate-metadata.py

  rust-core:
    name: Rust core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Repository invariants
        run: cargo xtask check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude alcomd-gui --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude alcomd-gui

      - name: Check standalone Discord extension backend
        run: |
          cargo fmt --manifest-path extensions/first-party/alcomd-extension-discord/backend/Cargo.toml -- --check
          cargo clippy --manifest-path extensions/first-party/alcomd-extension-discord/backend/Cargo.toml --all-targets -- -D warnings

  frontend:
    name: TypeScript and Vite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Build frontend
        run: npm run build

  gui-rust:
    name: Tauri Rust shell
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Check GUI Rust crate
        run: cargo check -p alcomd-gui
