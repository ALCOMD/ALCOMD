schema = 1

[metadata]
status_values = ["unknown", "not_started", "in_progress", "blocked", "verified"]
baseline_frozen = true
audit_status = "in_progress"
inventory_granularity = "domain_seed"
m1_complete = false
release_target = "4.0.0"

[[feature]]
id = "system.identity"
title = "稳定产品身份"
source = ["product-plan"]
implementation = "alcomd.product.toml"
release_class = "release_blocker"
status = "verified"
tests = ["cargo xtask check"]

[[feature]]
id = "daemon.single-writer"
title = "唯一核心与唯一写入者"
source = ["product-plan"]
implementation = "apps/alcomd"
release_class = "release_blocker"
