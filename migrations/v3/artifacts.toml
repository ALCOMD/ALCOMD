schema = 2
audit_complete = false
instance_snapshot_available = false

[classification]
R0 = "只读发现、身份与所有权确认"
R1 = "提交前可回滚导出或快照"
R2 = "提交前带 journal 的可回滚迁移或精确 patch"
C1 = "仅在 v4 Health Check 和 Commit marker 成功后清理"
N = "不得删除；只能精确迁移或保留"

# template_confirmed 只表示冻结源码证实了位置、格式或生成规则。
# confirmed 只表示真实安装快照中的具体实例已经完成身份与所有权确认。

