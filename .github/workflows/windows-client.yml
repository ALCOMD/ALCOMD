name: Windows client validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-10-22h2:
    name: Windows 10 22H2 client
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, alcomd-win10-22h2]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Verify Windows 10 client identity
        shell: pwsh
        run: .\scripts\assert-windows-client.ps1 -ExpectedClient Windows10
      - name: Setup
        shell: pwsh
        run: .\scripts\setup.ps1
      - name: Check
        shell: pwsh
        run: .\scripts\check.ps1
      - name: Test
        shell: pwsh
        run: .\scripts\test.ps1
      - name: Build M0 executables
        run: cargo build --locked --workspace --bins --release
      - name: Build Tauri GUI without a bundle
        run: npm run gui:build -- --no-bundle
      - name: Verify lock files and final diff
        shell: pwsh
        run: |
          git diff --exit-code -- `
            Cargo.lock `
            package-lock.json `
            extensions/first-party/alcomd-extension-discord/backend/Cargo.lock
          git diff --check
      - name: Record runner cleanup requirement
        if: always()
        shell: pwsh
        run: Write-Host "The runner owner must restore the approved clean Hyper-V checkpoint after this job."

  windows-11:
    name: Windows 11 client
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, alcomd-win11]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Verify Windows 11 client identity
        shell: pwsh
        run: .\scripts\assert-windows-client.ps1 -ExpectedClient Windows11
      - name: Setup
        shell: pwsh
        run: .\scripts\setup.ps1
      - name: Check
        shell: pwsh
        run: .\scripts\check.ps1
      - name: Test
        shell: pwsh
        run: .\scripts\test.ps1
      - name: Build M0 executables
        run: cargo build --locked --workspace --bins --release
      - name: Build Tauri GUI without a bundle
        run: npm run gui:build -- --no-bundle
      - name: Verify lock files and final diff
        shell: pwsh
        run: |
          git diff --exit-code -- `
            Cargo.lock `
            package-lock.json `
            extensions/first-party/alcomd-extension-discord/backend/Cargo.lock
          git diff --check
      - name: Record runner cleanup requirement
        if: always()
        shell: pwsh
        run: Write-Host "The runner owner must restore the approved clean Hyper-V checkpoint after this job."
