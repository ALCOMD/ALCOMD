[workspace]
resolver = "3"
members = [
    "apps/alcomd",
    "apps/alcomd-cli",
    "apps/alcomd-mcp",
    "apps/alcomd-api",
    "apps/alcomd-extension-host",
    "apps/alcomd-bootstrap",
    "apps/alcomd-updater",
    "apps/alcomd-gui/src-tauri",
    "crates/alcomd-domain",
    "crates/alcomd-application",
    "crates/alcomd-protocol",
    "crates/alcomd-client",
    "crates/alcomd-store",
    "crates/alcomd-platform",
    "crates/alcomd-vpm",
    "crates/alcomd-extensions",
    "crates/alcomd-import",
    "crates/alcomd-testing",
    "migrations/v3/app/alcomd-migrate-v3",
    "xtask",
]
default-members = [
    "apps/alcomd",
    "apps/alcomd-cli",
    "apps/alcomd-mcp",
    "apps/alcomd-api",
    "apps/alcomd-extension-host",
    "apps/alcomd-bootstrap",
    "apps/alcomd-updater",
    "crates/alcomd-domain",
    "crates/alcomd-application",
    "crates/alcomd-protocol",
    "crates/alcomd-client",
    "crates/alcomd-store",
    "crates/alcomd-platform",
    "crates/alcomd-vpm",
    "crates/alcomd-extensions",
    "crates/alcomd-import",
    "crates/alcomd-testing",
    "xtask",
]

[workspace.package]
version = "4.0.0-alpha.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["CQMHV"]
license = "AGPL-3.0-only"
repository = "https://github.com/ALCOMD/ALCOMD"
publish = false

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = "2"
tauri-build = "2"
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
semver = { version = "=1.0.28", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
unicode-normalization = { version = "=0.1.25", default-features = false, features = ["std"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ed25519-dalek = { version = "=3.0.0", default-features = false }
wasmtime = { version = "=48.0.0", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
open = { version = "=5.4.2", default-features = false }
tauri-plugin-dialog = { version = "=2.7.2", default-features = false, features = ["gtk3"] }

alcomd-domain = { path = "crates/alcomd-domain" }
alcomd-application = { path = "crates/alcomd-application" }
alcomd-protocol = { path = "crates/alcomd-protocol" }
alcomd-client = { path = "crates/alcomd-client" }
alcomd-store = { path = "crates/alcomd-store" }
alcomd-platform = { path = "crates/alcomd-platform" }
alcomd-vpm = { path = "crates/alcomd-vpm" }
alcomd-extensions = { path = "crates/alcomd-extensions" }
alcomd-updater = { path = "apps/alcomd-updater" }
alcomd-import = { path = "crates/alcomd-import" }
alcomd-testing = { path = "crates/alcomd-testing" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
