[package]
name = "alcomd-migrate-v3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "alcomd-migrate-v3"

[features]
windows-bridge = []

[[bin]]
name = "alcomd-v3-windows-bridge"
path = "src/bin/windows_bridge.rs"
required-features = ["windows-bridge"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
alcomd-client.workspace = true
alcomd-import.workspace = true
alcomd-domain.workspace = true
semver.workspace = true
alcomd-protocol.workspace = true
alcomd-platform.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
uuid.workspace = true
tokio.workspace = true
toml.workspace = true
url = "=2.5.8"
flate2 = { version = "=1.1.9", default-features = false, features = ["zlib-rs"] }
zip.workspace = true

[dev-dependencies]
alcomd-daemon = { package = "alcomd", path = "../../../../apps/alcomd", features = ["test-kill-gates"] }

[lints]
workspace = true
